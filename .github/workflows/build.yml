name: Build

on:
  push:
    # branches: [main, master]
    tags:
      - 'v*'
      - '*/*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build cc:Shared Mod
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine Build Target & Run Build
        run: |
          REF_NAME="${{ github.ref_name }}"

          if [[ "$REF_NAME" == *"/"* ]]; then
            TARGET="${REF_NAME%%/*}"
          else
            TARGET="all"
          fi

          echo "Target resolvido: $TARGET"

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "ccshared" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Building all Stonecutter versions..."
            ./gradlew buildAndCollect --no-daemon --stacktrace
          else
            echo "Building specific version: $TARGET..."
            ./gradlew ":$TARGET:build" --no-daemon --stacktrace
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-artifacts
          path: |
            build/libs/**/*.jar
            !versions/**/build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/libs/**/*.jar
            !versions/**/build/libs/*.jar
          generate_release_notes: true
