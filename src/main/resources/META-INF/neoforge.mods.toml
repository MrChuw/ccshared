modLoader = "javafml"
loaderVersion = "[2,)"
license = "${mod_license}"
issueTrackerURL = "${mod_repo_url}/issues"

[[mods]]
modId = "${mod_id}"
displayName = "${mod_name}"
version = "${mod_version}"
logoFile = "${mod_logo}"
iconFile = "${mod_logo}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "ccshared.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
